name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: tetgift-api
  CONTAINER_NAME: tetgift-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > image.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "image.tar.gz,docker-compose.prod.yml"
          target: "~/tetgift-api"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            mkdir -p ~/tetgift-api
            cd ~/tetgift-api
            
            gunzip -c image.tar.gz | docker load
            
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            
            cat > .env << EOF
            DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
            JWT_KEY=${{ secrets.JWT_KEY }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            OTP_SECRET=${{ secrets.OTP_SECRET }}
            EOF
            
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            
            $DC -f docker-compose.prod.yml up -d
            
            rm -f image.tar.gz
            docker image prune -f
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "Waiting for container to start..."
            sleep 10
            
            if docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
              echo "✅ Container is running!"
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
              curl -I http://localhost:5002 || true
            else
              echo "❌ Container failed to start!"
              docker logs ${{ env.CONTAINER_NAME }} || true
              exit 1
            fi